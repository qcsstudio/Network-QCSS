name: QCS editorial automation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  scan-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: qcs-advisory-ingestion
      cancel-in-progress: false
    steps:
      - name: Scan and publish authoritative advisories
        shell: bash
        run: |
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.qcsstudio.com%2Fautomation" | jq -r '.value')"
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 300 \
            -H "Authorization: Bearer ${token}" \
            "https://www.qcsstudio.com/api/cron/advisory-discovery"

  publish-social:
    needs: [scan-advisories, complete-content]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: qcs-editorial-social
      cancel-in-progress: false
    steps:
      - name: Process contextual images and LinkedIn queue
        shell: bash
        run: |
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.qcsstudio.com%2Fautomation" | jq -r '.value')"
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 300 \
            -H "Authorization: Bearer ${token}" \
            "https://www.qcsstudio.com/api/cron/social-publisher"

  complete-content:
    needs: scan-advisories
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: qcs-editorial-completion
      cancel-in-progress: false
    steps:
      - name: Complete queued research drafts
        shell: bash
        run: |
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.qcsstudio.com%2Fautomation" | jq -r '.value')"
          curl --fail-with-body --silent --show-error --retry 1 --retry-all-errors --max-time 300 \
            -H "Authorization: Bearer ${token}" \
            "https://www.qcsstudio.com/api/cron/content-editorial"
