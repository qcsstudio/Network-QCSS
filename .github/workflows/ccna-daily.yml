name: QCS CCNA weekday edition

on:
  schedule:
    - cron: "50 2 * * 1-5"
    - cron: "20 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: qcs-ccna-daily
  cancel-in-progress: false

jobs:
  publish-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish the next CCNA lesson and queue LinkedIn
        id: lesson
        shell: bash
        run: |
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.qcsstudio.com%2Fautomation" | jq -r '.value')"
          endpoint="https://www.qcsstudio.com/api/cron/ccna-daily"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then endpoint="${endpoint}?runNow=1"; fi
          if ! response="$(curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${token}" \
            "${endpoint}")"; then
            printf '%s' "${response}" | jq '{ok, error}'
            exit 1
          fi
          printf '%s' "${response}" | jq '{ok, action: .result.action, lesson: (.result.lesson | {slug, status, qualityScore, lastError}), distributionId}'
          printf '%s' "${response}" | jq -e '.ok == true and (.result.action == "published" or .result.action == "already_published" or .result.action == "not_due" or .result.action == "course_complete")' > /dev/null
          echo "publication_id=$(printf '%s' "${response}" | jq -r '.distributionId // empty')" >> "${GITHUB_OUTPUT}"

      - name: Process the queued LinkedIn edition
        if: ${{ steps.lesson.outputs.publication_id != '' }}
        shell: bash
        run: |
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.qcsstudio.com%2Fautomation" | jq -r '.value')"
          response="$(curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${token}" \
            "https://www.qcsstudio.com/api/cron/social-publisher?publicationId=${{ steps.lesson.outputs.publication_id }}")"
          printf '%s' "${response}" | jq '.'
          printf '%s' "${response}" | jq -e '.ok == true and ([.outcomes[] | select(.status != "published")] | length == 0)' > /dev/null
