name: QCS CCNA weekday edition

on:
  schedule:
    - cron: "50 2 * * 1-5"
    - cron: "20 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: qcs-ccna-daily
  cancel-in-progress: false

jobs:
  publish-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish the next CCNA lesson and queue LinkedIn
        shell: bash
        run: |
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.qcsstudio.com%2Fautomation" | jq -r '.value')"
          endpoint="https://www.qcsstudio.com/api/cron/ccna-daily"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then endpoint="${endpoint}?runNow=1"; fi
          curl --fail-with-body --silent --show-error --retry 1 --retry-all-errors --max-time 300 \
            -H "Authorization: Bearer ${token}" \
            "${endpoint}"

      - name: Process the queued LinkedIn edition
        if: ${{ always() }}
        shell: bash
        run: |
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.qcsstudio.com%2Fautomation" | jq -r '.value')"
          curl --fail-with-body --silent --show-error --retry 1 --retry-all-errors --max-time 300 \
            -H "Authorization: Bearer ${token}" \
            "https://www.qcsstudio.com/api/cron/social-publisher"
