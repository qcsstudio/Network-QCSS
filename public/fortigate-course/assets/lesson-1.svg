<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#102237"/><g fill="#eef7ff" font-family="Arial" font-size="27"><text x="40" y="52">QCS • Decisions • proposed topology</text><text x="40" y="105">Management: port1 reserved; disconnected pending private-path verification</text><rect x="35" y="160" width="310" height="150" rx="12" fill="#23415c"/><text x="50" y="198" font-size="23">LabClient</text><text x="50" y="240" font-size="23">10.77.10.10/24</text><text x="50" y="282" font-size="23">C_IF (verify)</text><rect x="445" y="160" width="310" height="150" rx="12" fill="#23415c"/><text x="460" y="198" font-size="23">FortiGate</text><text x="460" y="240" font-size="23">port2: 10.77.10.1/24</text><text x="460" y="282" font-size="23">port3: 10.77.20.1/24</text><rect x="855" y="160" width="310" height="150" rx="12" fill="#23415c"/><text x="870" y="198" font-size="23">LabServer</text><text x="870" y="240" font-size="23">10.77.20.10/24</text><text x="870" y="282" font-size="23">S_IF (verify)</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#71e5cf"/></marker></defs><path d="M90 380 H1100" stroke="#71e5cf" stroke-width="5" marker-end="url(#a)"/><text x="45" y="355">Request: client → FortiGate → server</text><path d="M1100 470 H90" stroke="#71e5cf" stroke-width="5" marker-end="url(#a)"/><text x="45" y="440">Reply: server → FortiGate → client</text><text x="40" y="550">Permit TCP 8080 only; no encryption configured</text><text x="40" y="600" font-size="23">Interface names are provisional. No Internet path; no NAT; no TLS protection.</text></g></svg>