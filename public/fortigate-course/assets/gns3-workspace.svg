<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><rect width="1500" height="1000" fill="#091522"/><g font-family="Arial" fill="#edf6ff"><text x="45" y="58" font-size="34">QCS / THE GNS3 LAB: WHAT RUNS INSIDE WHAT</text><text x="45" y="105" font-size="24" fill="#b4c9db">Proposed topology • build and adapter mapping unverified • no appliance runtime claimed</text><rect x="40" y="145" width="1420" height="785" rx="24" fill="#102338" stroke="#4c6f86" stroke-width="3"/><text x="70" y="195" font-size="30">Windows host / VMware Workstation</text><text x="70" y="238" font-size="23">Existing physical home/office network stays separate from the experiment.</text><rect x="85" y="285" width="1330" height="565" rx="20" fill="#142c40" stroke="#78ecd6" stroke-width="3"/><text x="115" y="335" font-size="29">GNS3 VM / QEMU-KVM compute</text><text x="115" y="374" font-size="22">Fresh project: QCS-FortiGate-Foundations • three guest nodes • private internal data links only</text><rect x="120" y="455" width="300" height="150" rx="14" fill="#091522" stroke="#ffd174" stroke-width="2"/><text x="133" y="494" font-size="23">LabClient</text><text x="133" y="534" font-size="23">10.77.10.10/24</text><text x="133" y="574" font-size="23">C_IF (verify)</text><rect x="600" y="455" width="300" height="150" rx="14" fill="#091522" stroke="#ffd174" stroke-width="2"/><text x="613" y="494" font-size="23">FortiGate</text><text x="613" y="534" font-size="23">port2: 10.77.10.1/24</text><text x="613" y="574" font-size="23">port3: 10.77.20.1/24</text><rect x="1080" y="455" width="300" height="150" rx="14" fill="#091522" stroke="#ffd174" stroke-width="2"/><text x="1093" y="494" font-size="23">LabServer</text><text x="1093" y="534" font-size="23">10.77.20.10/24</text><text x="1093" y="574" font-size="23">S_IF (verify)</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#78ecd6"/></marker></defs><path d="M425 500 H590 M905 500 H1070" fill="none" stroke="#78ecd6" stroke-width="5" marker-end="url(#arrow)"/><path d="M1070 565 H910 M590 565 H430" fill="none" stroke="#78ecd6" stroke-width="5" marker-end="url(#arrow)"/><text x="438" y="438" font-size="21">Client link</text><text x="930" y="438" font-size="21">Server link</text><text x="120" y="657" font-size="23">Forward: client → verified port2 → verified port3 → server</text><text x="120" y="696" font-size="23">Return: server → verified port3 → verified port2 → client</text><text x="120" y="741" font-size="23" fill="#ffd174">Port1 management: initially disconnected. Use the GNS3 console for first checks.</text><text x="120" y="787" font-size="22">Later management path needs its own verified private host-only design and backup checkpoint.</text><text x="70" y="890" font-size="23">Nested boxes show execution layers. Arrows show only the proposed internal packet paths.</text><text x="45" y="972" font-size="22" fill="#b4c9db">No Cloud/NAT/physical bridge • no Internet default route • no NAT/TLS protection configured</text></g></svg>