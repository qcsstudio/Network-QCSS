<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="graphic-title graphic-desc"><title id="graphic-title">Four issues, four validation boundaries</title><desc id="graphic-desc">Four software boundaries covered in this guide: decompression and memory safety, DNS name handling, TLS certificate identity checks and IPv4 interpretation. Match each issue to the vendor product status before choosing a fix.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3965be" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.signal{stroke-dasharray:12 80;animation:signalFlow 3s linear infinite;opacity:.8}@keyframes signalFlow{to{stroke-dashoffset:-184}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.25}}</style><rect width="1040" height="650" fill="#fff"/><text x="44" y="37" fill="#a82057" font-size="15" font-weight="700"><tspan x="44" dy="0">QCS  /  SECURITY ADVISORY</tspan></text><text x="44" y="84" fill="#242633" font-size="32" font-weight="700"><tspan x="44" dy="0">Four issues, four validation boundaries</tspan></text><text x="44" y="159" fill="#58657a" font-size="14" font-weight="700"><tspan x="44" dy="0">INPUT OR DATA PATH</tspan></text><text x="394" y="159" fill="#58657a" font-size="14" font-weight="700"><tspan x="394" dy="0">COMPONENT TO ASSESS</tspan></text><text x="790" y="159" fill="#58657a" font-size="14" font-weight="700"><tspan x="790" dy="0">WHAT MUST HOLD</tspan></text><g><g transform="translate(44 188)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-memory-stick" aria-hidden="true"><path d="M12 12v-2"></path><path d="M12 18v-2"></path><path d="M16 12v-2"></path><path d="M16 18v-2"></path><path d="M2 11h1.5"></path><path d="M20 18v-2"></path><path d="M20.5 11H22"></path><path d="M4 18v-2"></path><path d="M8 12v-2"></path><path d="M8 18v-2"></path><rect x="2" y="6" width="20" height="10" rx="2"></rect></svg></g><text x="90" y="211" fill="#242633" font-size="21" font-weight="500"><tspan x="90" dy="0">Compressed content</tspan></text><path d="M315 204 L374 204" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M315 204 L374 204" fill="none" stroke="#3965be" stroke-width="4"/><text x="394" y="211" fill="#3965be" font-size="22" font-weight="700"><tspan x="394" dy="0">Brotli decoder</tspan></text><path d="M686 204 L754 204" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M686 204 L754 204" fill="none" stroke="#3965be" stroke-width="4"/><text x="790" y="211" fill="#242633" font-size="20" font-weight="500"><tspan x="790" dy="0">Memory safety</tspan></text></g><g><g transform="translate(44 273)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network" aria-hidden="true"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg></g><text x="90" y="296" fill="#242633" font-size="21" font-weight="500"><tspan x="90" dy="0">Host name input</tspan></text><path d="M315 289 L374 289" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M315 289 L374 289" fill="none" stroke="#3965be" stroke-width="4"/><text x="394" y="296" fill="#3965be" font-size="22" font-weight="700"><tspan x="394" dy="0">DNS resolution</tspan></text><path d="M686 289 L754 289" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M686 289 L754 289" fill="none" stroke="#3965be" stroke-width="4"/><text x="790" y="296" fill="#242633" font-size="20" font-weight="500"><tspan x="790" dy="0">Destination selection</tspan></text></g><g><g transform="translate(44 358)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-badge-check" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"></path><path d="m9 12 2 2 4-4"></path></svg></g><text x="90" y="381" fill="#242633" font-size="21" font-weight="500"><tspan x="90" dy="0">Unusual IP digits</tspan></text><path d="M315 374 L374 374" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M315 374 L374 374" fill="none" stroke="#3965be" stroke-width="4"/><text x="394" y="381" fill="#3965be" font-size="22" font-weight="700"><tspan x="394" dy="0">TLS certificate check</tspan></text><path d="M686 374 L754 374" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M686 374 L754 374" fill="none" stroke="#3965be" stroke-width="4"/><text x="790" y="381" fill="#242633" font-size="20" font-weight="500"><tspan x="790" dy="0">Peer identity</tspan></text></g><g><g transform="translate(44 443)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-route" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg></g><text x="90" y="466" fill="#242633" font-size="21" font-weight="500"><tspan x="90" dy="0">Noncanonical address</tspan></text><path d="M315 459 L374 459" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M315 459 L374 459" fill="none" stroke="#3965be" stroke-width="4"/><text x="394" y="466" fill="#3965be" font-size="22" font-weight="700"><tspan x="394" dy="0">IPv4 interpretation</tspan></text><path d="M686 459 L754 459" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M686 459 L754 459" fill="none" stroke="#3965be" stroke-width="4"/><text x="790" y="466" fill="#242633" font-size="20" font-weight="500"><tspan x="790" dy="0">Consistent identity</tspan></text></g><text x="44" y="565" fill="#a82057" font-size="19" font-weight="700"><tspan x="44" dy="0">Product model + deployed software + operating mode -&gt; vendor applicability -&gt; supported change</tspan></text><line x1="44" y1="607" x2="996" y2="607" stroke="#cbd5e1"/><text x="44" y="631" fill="#58657a" font-size="15" font-weight="500"><tspan x="44" dy="0">Software behaviour, illustrated. Confirm product applicability against the vendor advisory.</tspan></text></svg>