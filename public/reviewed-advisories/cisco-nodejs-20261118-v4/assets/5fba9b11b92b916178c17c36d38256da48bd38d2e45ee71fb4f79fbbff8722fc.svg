<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" role="img" aria-labelledby="graphic-title graphic-desc"><title id="graphic-title">IPv4 interpretation:|connect and authenticate the same host</title><desc id="graphic-desc">Three stages compare an address input, the connected destination and the certificate identity. Both processing paths must refer to the same intended host.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3965be" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.signal{stroke-dasharray:12 80;animation:signalFlow 3s linear infinite;opacity:.8}@keyframes signalFlow{to{stroke-dashoffset:-184}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.25}}</style><rect width="1040" height="720" fill="#fff"/><text x="44" y="37" fill="#a82057" font-size="15" font-weight="700"><tspan x="44" dy="0">QCS  /  SECURITY ADVISORY</tspan></text><text x="44" y="84" fill="#242633" font-size="32" font-weight="700"><tspan x="44" dy="0">IPv4 interpretation:</tspan><tspan x="44" dy="46">connect and authenticate the same host</tspan></text><text x="44" y="161" fill="#a82057" font-size="16" font-weight="700"><tspan x="44" dy="0">CVE-2026-106069</tspan></text><g><rect x="44" y="310" width="266" height="165" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(62 328)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-braces" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"></path><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"></path></svg></g><text x="62" y="386" fill="#3965be" font-size="23" font-weight="700"><tspan x="62" dy="0">Same address input</tspan></text><text x="62" y="422" fill="#242633" font-size="19" font-weight="500"><tspan x="62" dy="0">Noncanonical</tspan><tspan x="62" dy="28">IPv4 spelling</tspan></text></g><path d="M316 392 L390 392 L390 285 L444 285" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M316 392 L390 392 L390 285 L444 285" fill="none" stroke="#3965be" stroke-width="4"/><path d="M390 392 L390 485 L444 485" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M390 392 L390 485 L444 485" fill="none" stroke="#3965be" stroke-width="4"/><g><rect x="460" y="210" width="536" height="150" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(478 228)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-router" aria-hidden="true"><rect width="20" height="8" x="2" y="14" rx="2"></rect><path d="M6.01 18H6"></path><path d="M10.01 18H10"></path><path d="M15 10v4"></path><path d="M17.84 7.17a4 4 0 0 0-5.66 0"></path><path d="M20.66 4.34a8 8 0 0 0-11.31 0"></path></svg></g><text x="478" y="286" fill="#3965be" font-size="23" font-weight="700"><tspan x="478" dy="0">Connection interpretation</tspan></text><text x="478" y="322" fill="#242633" font-size="19" font-weight="500"><tspan x="478" dy="0">Network resolver selects the destination.</tspan></text></g><g><rect x="460" y="410" width="536" height="150" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(478 428)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-fingerprint-pattern" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path><path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path><path d="M2 12a10 10 0 0 1 18-6"></path><path d="M2 16h.01"></path><path d="M21.8 16c.2-2 .131-5.354 0-6"></path><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path><path d="M8.65 22c.21-.66.45-1.32.57-2"></path><path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path></svg></g><text x="478" y="486" fill="#3965be" font-size="23" font-weight="700"><tspan x="478" dy="0">Certificate interpretation</tspan></text><text x="478" y="522" fill="#242633" font-size="19" font-weight="500"><tspan x="478" dy="0">TLS identity checker interprets the address.</tspan></text></g><text x="44" y="627" fill="#a82057" font-size="24" font-weight="700"><tspan x="44" dy="0">Both branches must refer to the same intended host.</tspan></text><line x1="44" y1="677" x2="996" y2="677" stroke="#cbd5e1"/><text x="44" y="701" fill="#58657a" font-size="15" font-weight="500"><tspan x="44" dy="0">Software behaviour, illustrated. Confirm product applicability against the vendor advisory.</tspan></text></svg>