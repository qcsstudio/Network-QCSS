<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="566" viewBox="0 0 1040 566" role="img" aria-labelledby="graphic-title graphic-desc"><title id="graphic-title">TLS identity:|encryption is not the same as identity</title><desc id="graphic-desc">Three stages: endpoint input, certificate identity checking and a trust decision. Encryption and authentication are shown as distinct concepts.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3965be" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.signal{stroke-dasharray:12 80;animation:signalFlow 3s linear infinite;opacity:.8}@keyframes signalFlow{to{stroke-dashoffset:-184}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.25}}</style><rect width="1040" height="566" fill="#fff"/><text x="44" y="37" fill="#a82057" font-size="15" font-weight="700"><tspan x="44" dy="0">QCS  /  SECURITY ADVISORY</tspan></text><text x="44" y="84" fill="#242633" font-size="32" font-weight="700"><tspan x="44" dy="0">TLS identity:</tspan><tspan x="44" dy="46">encryption is not the same as identity</tspan></text><text x="44" y="161" fill="#a82057" font-size="16" font-weight="700"><tspan x="44" dy="0">CVE-2026-105483</tspan></text><g><rect x="44" y="196" width="280" height="164" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(62 214)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-text-cursor-input" aria-hidden="true"><path d="M12 20h-1a2 2 0 0 1-2-2 2 2 0 0 1-2 2H6"></path><path d="M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7"></path><path d="M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1"></path><path d="M6 4h1a2 2 0 0 1 2 2 2 2 0 0 1 2-2h1"></path><path d="M9 6v12"></path></svg></g><text x="62" y="272" fill="#3965be" font-size="23" font-weight="700"><tspan x="62" dy="0">Endpoint input</tspan></text><text x="62" y="308" fill="#242633" font-size="19" font-weight="500"><tspan x="62" dy="0">An IP address is written</tspan><tspan x="62" dy="28">using unusual digits</tspan></text></g><g><rect x="380" y="196" width="280" height="164" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(398 214)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-badge-check" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"></path><path d="m9 12 2 2 4-4"></path></svg></g><text x="398" y="272" fill="#3965be" font-size="23" font-weight="700"><tspan x="398" dy="0">Certificate check</tspan></text><text x="398" y="308" fill="#242633" font-size="19" font-weight="500"><tspan x="398" dy="0">The identity check can</tspan><tspan x="398" dy="28">misclassify the input</tspan></text></g><g><rect x="716" y="196" width="280" height="164" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(734 214)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-alert" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg></g><text x="734" y="272" fill="#3965be" font-size="23" font-weight="700"><tspan x="734" dy="0">Trust decision</tspan></text><text x="734" y="308" fill="#242633" font-size="19" font-weight="500"><tspan x="734" dy="0">An unsuitable certificate</tspan><tspan x="734" dy="28">may be accepted</tspan></text></g><path d="M328 277 L374 277" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M328 277 L374 277" fill="none" stroke="#3965be" stroke-width="4"/><path d="M664 277 L710 277" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M664 277 L710 277" fill="none" stroke="#3965be" stroke-width="4"/><text x="44" y="408" fill="#58657a" font-size="20" font-weight="500"><tspan x="44" dy="0">Certificate identity is separate from encryption.</tspan></text><line x1="44" y1="431" x2="996" y2="431" stroke="#cbd5e1"/><text x="44" y="468" fill="#242633" font-size="20" font-weight="500"><tspan x="44" dy="0">An encrypted connection must still authenticate the intended peer.</tspan><tspan x="44" dy="29">Keep certificate validation enabled; use supported remediation.</tspan></text><line x1="44" y1="523" x2="996" y2="523" stroke="#cbd5e1"/><text x="44" y="547" fill="#58657a" font-size="15" font-weight="500"><tspan x="44" dy="0">Software behaviour, illustrated. Confirm product applicability against the vendor advisory.</tspan></text></svg>