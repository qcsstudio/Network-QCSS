<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="graphic-title graphic-desc"><title id="graphic-title">TLS identity checking</title><desc id="graphic-desc">Three stages: endpoint input, certificate identity checking and a trust decision. Encryption and authentication are shown as distinct concepts.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3965be" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.signal{stroke-dasharray:12 80;animation:signalFlow 3s linear infinite;opacity:.8}@keyframes signalFlow{to{stroke-dashoffset:-184}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.25}}</style><rect width="360" height="1000" fill="#fff"/><text x="20" y="31" fill="#a82057" font-size="12" font-weight="700"><tspan x="20" dy="0">QCS  /  SECURITY ADVISORY</tspan></text><text x="20" y="65" fill="#242633" font-size="22" font-weight="700"><tspan x="20" dy="0">TLS identity checking</tspan></text><text x="20" y="135" fill="#a82057" font-size="14" font-weight="700"><tspan x="20" dy="0">CVE-2026-105483</tspan></text><g><rect x="20" y="170" width="320" height="158" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 188)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-text-cursor-input" aria-hidden="true"><path d="M12 20h-1a2 2 0 0 1-2-2 2 2 0 0 1-2 2H6"></path><path d="M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7"></path><path d="M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1"></path><path d="M6 4h1a2 2 0 0 1 2 2 2 2 0 0 1 2-2h1"></path><path d="M9 6v12"></path></svg></g><text x="38" y="235" fill="#3965be" font-size="18" font-weight="700"><tspan x="38" dy="0">Endpoint input</tspan></text><text x="38" y="264" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">An IP address is written</tspan><tspan x="38" dy="23">using unusual digits</tspan></text></g><path d="M180 330 L180 352" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M180 330 L180 352" fill="none" stroke="#3965be" stroke-width="4"/><g><rect x="20" y="362" width="320" height="158" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 380)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-badge-check" aria-hidden="true"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"></path><path d="m9 12 2 2 4-4"></path></svg></g><text x="38" y="427" fill="#3965be" font-size="18" font-weight="700"><tspan x="38" dy="0">Certificate check</tspan></text><text x="38" y="456" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">The identity check can</tspan><tspan x="38" dy="23">misclassify the input</tspan></text></g><path d="M180 522 L180 544" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M180 522 L180 544" fill="none" stroke="#3965be" stroke-width="4"/><g><rect x="20" y="554" width="320" height="158" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 572)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-alert" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg></g><text x="38" y="619" fill="#3965be" font-size="18" font-weight="700"><tspan x="38" dy="0">Trust decision</tspan></text><text x="38" y="648" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">An unsuitable certificate</tspan><tspan x="38" dy="23">may be accepted</tspan></text></g><text x="20" y="780" fill="#a82057" font-size="18" font-weight="700"><tspan x="20" dy="0">What to understand</tspan></text><text x="20" y="813" fill="#242633" font-size="16" font-weight="500"><tspan x="20" dy="0">An encrypted connection must still</tspan><tspan x="20" dy="23">authenticate the intended peer.</tspan></text><text x="20" y="910" fill="#58657a" font-size="14" font-weight="500"><tspan x="20" dy="0">Confirm the affected product and</tspan><tspan x="20" dy="20">supported fix in the vendor advisory.</tspan></text><line x1="20" y1="957" x2="340" y2="957" stroke="#cbd5e1"/><text x="20" y="981" fill="#58657a" font-size="11" font-weight="500"><tspan x="20" dy="0">Software behaviour, illustrated</tspan></text></svg>