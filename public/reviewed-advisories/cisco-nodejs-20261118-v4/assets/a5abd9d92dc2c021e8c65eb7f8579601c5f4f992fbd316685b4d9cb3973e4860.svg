<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="566" viewBox="0 0 1040 566" role="img" aria-labelledby="graphic-title graphic-desc"><title id="graphic-title">DNS names:|checked text and resolved text must agree</title><desc id="graphic-desc">Three stages: name validation, DNS resolution and destination selection. The diagram highlights why checked names and resolved names must agree.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3965be" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.signal{stroke-dasharray:12 80;animation:signalFlow 3s linear infinite;opacity:.8}@keyframes signalFlow{to{stroke-dashoffset:-184}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.25}}</style><rect width="1040" height="566" fill="#fff"/><text x="44" y="37" fill="#a82057" font-size="15" font-weight="700"><tspan x="44" dy="0">QCS  /  SECURITY ADVISORY</tspan></text><text x="44" y="84" fill="#242633" font-size="32" font-weight="700"><tspan x="44" dy="0">DNS names:</tspan><tspan x="44" dy="46">checked text and resolved text must agree</tspan></text><text x="44" y="161" fill="#a82057" font-size="16" font-weight="700"><tspan x="44" dy="0">CVE-2026-105482</tspan></text><g><rect x="44" y="196" width="280" height="164" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(62 214)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-checks" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg></g><text x="62" y="272" fill="#3965be" font-size="23" font-weight="700"><tspan x="62" dy="0">Name validation</tspan></text><text x="62" y="308" fill="#242633" font-size="19" font-weight="500"><tspan x="62" dy="0">The application checks</tspan><tspan x="62" dy="28">the supplied name</tspan></text></g><g><rect x="380" y="196" width="280" height="164" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(398 214)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network" aria-hidden="true"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg></g><text x="398" y="272" fill="#3965be" font-size="23" font-weight="700"><tspan x="398" dy="0">DNS resolution</tspan></text><text x="398" y="308" fill="#242633" font-size="19" font-weight="500"><tspan x="398" dy="0">A NUL byte can shorten</tspan><tspan x="398" dy="28">the name being resolved</tspan></text></g><g><rect x="716" y="196" width="280" height="164" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(734 214)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-route" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg></g><text x="734" y="272" fill="#3965be" font-size="23" font-weight="700"><tspan x="734" dy="0">Selected destination</tspan></text><text x="734" y="308" fill="#242633" font-size="19" font-weight="500"><tspan x="734" dy="0">It can differ from</tspan><tspan x="734" dy="28">the name that was checked</tspan></text></g><path d="M328 277 L374 277" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M328 277 L374 277" fill="none" stroke="#3965be" stroke-width="4"/><path d="M664 277 L710 277" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M664 277 L710 277" fill="none" stroke="#3965be" stroke-width="4"/><text x="44" y="408" fill="#58657a" font-size="20" font-weight="500"><tspan x="44" dy="0">A name check and a name lookup serve different purposes.</tspan></text><line x1="44" y1="431" x2="996" y2="431" stroke="#cbd5e1"/><text x="44" y="468" fill="#242633" font-size="20" font-weight="500"><tspan x="44" dy="0">The resolved name must correspond to the name the application checked.</tspan><tspan x="44" dy="29">Assessment question: do validation and resolution use the same input?</tspan></text><line x1="44" y1="523" x2="996" y2="523" stroke="#cbd5e1"/><text x="44" y="547" fill="#58657a" font-size="15" font-weight="500"><tspan x="44" dy="0">Software behaviour, illustrated. Confirm product applicability against the vendor advisory.</tspan></text></svg>