<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="566" viewBox="0 0 1040 566" role="img" aria-labelledby="graphic-title graphic-desc"><title id="graphic-title">Brotli decoding:|where memory safety matters</title><desc id="graphic-desc">Three stages: compressed input, a Brotli decoder and application memory. The final stage explains that writes must remain inside valid memory bounds.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3965be" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.signal{stroke-dasharray:12 80;animation:signalFlow 3s linear infinite;opacity:.8}@keyframes signalFlow{to{stroke-dashoffset:-184}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.25}}</style><rect width="1040" height="566" fill="#fff"/><text x="44" y="37" fill="#a82057" font-size="15" font-weight="700"><tspan x="44" dy="0">QCS  /  SECURITY ADVISORY</tspan></text><text x="44" y="84" fill="#242633" font-size="32" font-weight="700"><tspan x="44" dy="0">Brotli decoding:</tspan><tspan x="44" dy="46">where memory safety matters</tspan></text><text x="44" y="161" fill="#a82057" font-size="16" font-weight="700"><tspan x="44" dy="0">CVE-2026-111497</tspan></text><g><rect x="44" y="196" width="280" height="164" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(62 214)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-archive" aria-hidden="true"><path d="M13.659 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v11.5"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M8 12v-1"></path><path d="M8 18v-2"></path><path d="M8 7V6"></path><circle cx="8" cy="20" r="2"></circle></svg></g><text x="62" y="272" fill="#3965be" font-size="23" font-weight="700"><tspan x="62" dy="0">Compressed input</tspan></text><text x="62" y="308" fill="#242633" font-size="19" font-weight="500"><tspan x="62" dy="0">Content supplied to</tspan><tspan x="62" dy="28">the application</tspan></text></g><g><rect x="380" y="196" width="280" height="164" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(398 214)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-binary" aria-hidden="true"><rect x="14" y="14" width="4" height="6" rx="2"></rect><rect x="6" y="4" width="4" height="6" rx="2"></rect><path d="M6 20h4"></path><path d="M14 10h4"></path><path d="M6 14h2v6"></path><path d="M14 4h2v6"></path></svg></g><text x="398" y="272" fill="#3965be" font-size="23" font-weight="700"><tspan x="398" dy="0">Brotli decoder</tspan></text><text x="398" y="308" fill="#242633" font-size="19" font-weight="500"><tspan x="398" dy="0">Expands compressed data</tspan><tspan x="398" dy="28">into usable content</tspan></text></g><g><rect x="716" y="196" width="280" height="164" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(734 214)"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-memory-stick" aria-hidden="true"><path d="M12 12v-2"></path><path d="M12 18v-2"></path><path d="M16 12v-2"></path><path d="M16 18v-2"></path><path d="M2 11h1.5"></path><path d="M20 18v-2"></path><path d="M20.5 11H22"></path><path d="M4 18v-2"></path><path d="M8 12v-2"></path><path d="M8 18v-2"></path><rect x="2" y="6" width="20" height="10" rx="2"></rect></svg></g><text x="734" y="272" fill="#3965be" font-size="23" font-weight="700"><tspan x="734" dy="0">Application memory</tspan></text><text x="734" y="308" fill="#242633" font-size="19" font-weight="500"><tspan x="734" dy="0">Writes must remain</tspan><tspan x="734" dy="28">inside valid bounds</tspan></text></g><path d="M328 277 L374 277" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M328 277 L374 277" fill="none" stroke="#3965be" stroke-width="4"/><path d="M664 277 L710 277" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M664 277 L710 277" fill="none" stroke="#3965be" stroke-width="4"/><text x="44" y="408" fill="#58657a" font-size="20" font-weight="500"><tspan x="44" dy="0">The data path determines which component handles the input.</tspan></text><line x1="44" y1="431" x2="996" y2="431" stroke="#cbd5e1"/><text x="44" y="468" fill="#242633" font-size="20" font-weight="500"><tspan x="44" dy="0">A decoder must keep writes inside the intended memory buffer.</tspan><tspan x="44" dy="29">Assessment question: which application accepts and decompresses this data?</tspan></text><line x1="44" y1="523" x2="996" y2="523" stroke="#cbd5e1"/><text x="44" y="547" fill="#58657a" font-size="15" font-weight="500"><tspan x="44" dy="0">Software behaviour, illustrated. Confirm product applicability against the vendor advisory.</tspan></text></svg>