<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="graphic-title graphic-desc"><title id="graphic-title">Brotli decoding</title><desc id="graphic-desc">Three stages: compressed input, a Brotli decoder and application memory. The final stage explains that writes must remain inside valid memory bounds.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3965be" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.signal{stroke-dasharray:12 80;animation:signalFlow 3s linear infinite;opacity:.8}@keyframes signalFlow{to{stroke-dashoffset:-184}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.25}}</style><rect width="360" height="1000" fill="#fff"/><text x="20" y="31" fill="#a82057" font-size="12" font-weight="700"><tspan x="20" dy="0">QCS  /  SECURITY ADVISORY</tspan></text><text x="20" y="65" fill="#242633" font-size="22" font-weight="700"><tspan x="20" dy="0">Brotli decoding</tspan></text><text x="20" y="135" fill="#a82057" font-size="14" font-weight="700"><tspan x="20" dy="0">CVE-2026-111497</tspan></text><g><rect x="20" y="170" width="320" height="158" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 188)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-archive" aria-hidden="true"><path d="M13.659 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v11.5"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M8 12v-1"></path><path d="M8 18v-2"></path><path d="M8 7V6"></path><circle cx="8" cy="20" r="2"></circle></svg></g><text x="38" y="235" fill="#3965be" font-size="18" font-weight="700"><tspan x="38" dy="0">Compressed input</tspan></text><text x="38" y="264" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">Content supplied to</tspan><tspan x="38" dy="23">the application</tspan></text></g><path d="M180 330 L180 352" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M180 330 L180 352" fill="none" stroke="#3965be" stroke-width="4"/><g><rect x="20" y="362" width="320" height="158" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 380)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-binary" aria-hidden="true"><rect x="14" y="14" width="4" height="6" rx="2"></rect><rect x="6" y="4" width="4" height="6" rx="2"></rect><path d="M6 20h4"></path><path d="M14 10h4"></path><path d="M6 14h2v6"></path><path d="M14 4h2v6"></path></svg></g><text x="38" y="427" fill="#3965be" font-size="18" font-weight="700"><tspan x="38" dy="0">Brotli decoder</tspan></text><text x="38" y="456" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">Expands compressed data</tspan><tspan x="38" dy="23">into usable content</tspan></text></g><path d="M180 522 L180 544" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M180 522 L180 544" fill="none" stroke="#3965be" stroke-width="4"/><g><rect x="20" y="554" width="320" height="158" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 572)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-memory-stick" aria-hidden="true"><path d="M12 12v-2"></path><path d="M12 18v-2"></path><path d="M16 12v-2"></path><path d="M16 18v-2"></path><path d="M2 11h1.5"></path><path d="M20 18v-2"></path><path d="M20.5 11H22"></path><path d="M4 18v-2"></path><path d="M8 12v-2"></path><path d="M8 18v-2"></path><rect x="2" y="6" width="20" height="10" rx="2"></rect></svg></g><text x="38" y="619" fill="#3965be" font-size="18" font-weight="700"><tspan x="38" dy="0">Application memory</tspan></text><text x="38" y="648" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">Writes must remain</tspan><tspan x="38" dy="23">inside valid bounds</tspan></text></g><text x="20" y="780" fill="#a82057" font-size="18" font-weight="700"><tspan x="20" dy="0">What to understand</tspan></text><text x="20" y="813" fill="#242633" font-size="16" font-weight="500"><tspan x="20" dy="0">A decoder must keep writes inside</tspan><tspan x="20" dy="23">the intended memory buffer.</tspan></text><text x="20" y="910" fill="#58657a" font-size="14" font-weight="500"><tspan x="20" dy="0">Confirm the affected product and</tspan><tspan x="20" dy="20">supported fix in the vendor advisory.</tspan></text><line x1="20" y1="957" x2="340" y2="957" stroke="#cbd5e1"/><text x="20" y="981" fill="#58657a" font-size="11" font-weight="500"><tspan x="20" dy="0">Software behaviour, illustrated</tspan></text></svg>