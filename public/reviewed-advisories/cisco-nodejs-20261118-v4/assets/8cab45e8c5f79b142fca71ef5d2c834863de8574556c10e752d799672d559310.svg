<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" role="img" aria-labelledby="graphic-title graphic-desc"><title id="graphic-title">DNS name handling</title><desc id="graphic-desc">Three stages: name validation, DNS resolution and destination selection. The diagram highlights why checked names and resolved names must agree.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3965be" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.signal{stroke-dasharray:12 80;animation:signalFlow 3s linear infinite;opacity:.8}@keyframes signalFlow{to{stroke-dashoffset:-184}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.25}}</style><rect width="360" height="1000" fill="#fff"/><text x="20" y="31" fill="#a82057" font-size="12" font-weight="700"><tspan x="20" dy="0">QCS  /  SECURITY ADVISORY</tspan></text><text x="20" y="65" fill="#242633" font-size="22" font-weight="700"><tspan x="20" dy="0">DNS name handling</tspan></text><text x="20" y="135" fill="#a82057" font-size="14" font-weight="700"><tspan x="20" dy="0">CVE-2026-105482</tspan></text><g><rect x="20" y="170" width="320" height="158" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 188)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-checks" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg></g><text x="38" y="235" fill="#3965be" font-size="18" font-weight="700"><tspan x="38" dy="0">Name validation</tspan></text><text x="38" y="264" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">The application checks</tspan><tspan x="38" dy="23">the supplied name</tspan></text></g><path d="M180 330 L180 352" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M180 330 L180 352" fill="none" stroke="#3965be" stroke-width="4"/><g><rect x="20" y="362" width="320" height="158" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 380)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-network" aria-hidden="true"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg></g><text x="38" y="427" fill="#3965be" font-size="18" font-weight="700"><tspan x="38" dy="0">DNS resolution</tspan></text><text x="38" y="456" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">A NUL byte can shorten</tspan><tspan x="38" dy="23">the name being resolved</tspan></text></g><path d="M180 522 L180 544" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M180 522 L180 544" fill="none" stroke="#3965be" stroke-width="4"/><g><rect x="20" y="554" width="320" height="158" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 572)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-route" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg></g><text x="38" y="619" fill="#3965be" font-size="18" font-weight="700"><tspan x="38" dy="0">Selected destination</tspan></text><text x="38" y="648" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">It can differ from</tspan><tspan x="38" dy="23">the name that was checked</tspan></text></g><text x="20" y="780" fill="#a82057" font-size="18" font-weight="700"><tspan x="20" dy="0">What to understand</tspan></text><text x="20" y="813" fill="#242633" font-size="16" font-weight="500"><tspan x="20" dy="0">The resolved name must correspond to</tspan><tspan x="20" dy="23">the name the application checked.</tspan></text><text x="20" y="910" fill="#58657a" font-size="14" font-weight="500"><tspan x="20" dy="0">Confirm the affected product and</tspan><tspan x="20" dy="20">supported fix in the vendor advisory.</tspan></text><line x1="20" y1="957" x2="340" y2="957" stroke="#cbd5e1"/><text x="20" y="981" fill="#58657a" font-size="11" font-weight="500"><tspan x="20" dy="0">Software behaviour, illustrated</tspan></text></svg>