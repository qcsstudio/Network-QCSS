<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="graphic-title graphic-desc"><title id="graphic-title">IPv4 interpretation</title><desc id="graphic-desc">Three stages compare an address input, the connected destination and the certificate identity. Both processing paths must refer to the same intended host.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#3965be" stroke-width="1.7"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.signal{stroke-dasharray:12 80;animation:signalFlow 3s linear infinite;opacity:.8}@keyframes signalFlow{to{stroke-dashoffset:-184}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.25}}</style><rect width="360" height="1040" fill="#fff"/><text x="20" y="31" fill="#a82057" font-size="12" font-weight="700"><tspan x="20" dy="0">QCS  /  SECURITY ADVISORY</tspan></text><text x="20" y="65" fill="#242633" font-size="22" font-weight="700"><tspan x="20" dy="0">IPv4 interpretation</tspan></text><text x="20" y="135" fill="#a82057" font-size="14" font-weight="700"><tspan x="20" dy="0">CVE-2026-106069</tspan></text><g><rect x="20" y="170" width="320" height="158" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 188)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-braces" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"></path><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"></path></svg></g><text x="38" y="235" fill="#3965be" font-size="18" font-weight="700"><tspan x="38" dy="0">Same address input</tspan></text><text x="38" y="264" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">Noncanonical IPv4 spelling</tspan><tspan x="38" dy="23">enters two processing paths</tspan></text></g><path d="M180 332 L180 365 L97 365 L97 397" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M180 332 L180 365 L97 365 L97 397" fill="none" stroke="#3965be" stroke-width="4"/><path d="M180 365 L263 365 L263 397" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M180 365 L263 365 L263 397" fill="none" stroke="#3965be" stroke-width="4"/><rect x="20" y="410" width="154" height="240" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(36 428)"><svg xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-router" aria-hidden="true"><rect width="20" height="8" x="2" y="14" rx="2"></rect><path d="M6.01 18H6"></path><path d="M10.01 18H10"></path><path d="M15 10v4"></path><path d="M17.84 7.17a4 4 0 0 0-5.66 0"></path><path d="M20.66 4.34a8 8 0 0 0-11.31 0"></path></svg></g><text x="36" y="487" fill="#3965be" font-size="18" font-weight="700"><tspan x="36" dy="0">Connection</tspan><tspan x="36" dy="26">target</tspan></text><text x="36" y="554" fill="#242633" font-size="16" font-weight="500"><tspan x="36" dy="0">Network</tspan><tspan x="36" dy="23">resolver</tspan><tspan x="36" dy="23">interpretation</tspan></text><rect x="186" y="410" width="154" height="240" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(202 428)"><svg xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#3965be" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-fingerprint-pattern" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path><path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path><path d="M2 12a10 10 0 0 1 18-6"></path><path d="M2 16h.01"></path><path d="M21.8 16c.2-2 .131-5.354 0-6"></path><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path><path d="M8.65 22c.21-.66.45-1.32.57-2"></path><path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path></svg></g><text x="202" y="487" fill="#3965be" font-size="18" font-weight="700"><tspan x="202" dy="0">Certificate</tspan><tspan x="202" dy="26">identity</tspan></text><text x="202" y="554" fill="#242633" font-size="16" font-weight="500"><tspan x="202" dy="0">TLS identity</tspan><tspan x="202" dy="23">checker</tspan><tspan x="202" dy="23">interpretation</tspan></text><path d="M97 655 L97 720 L180 720 L180 775" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M97 655 L97 720 L180 720 L180 775" fill="none" stroke="#3965be" stroke-width="4"/><path d="M263 655 L263 720 L180 720" fill="none" stroke="#3965be" stroke-width="2.5" marker-end="url(#arrow)"/><path class="signal" d="M263 655 L263 720 L180 720" fill="none" stroke="#3965be" stroke-width="4"/><g><rect x="20" y="790" width="320" height="164" rx="6" fill="white" stroke="#cbd5e1"/><g transform="translate(38 808)"><svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#a82057" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-git-compare-arrows" aria-hidden="true"><circle cx="5" cy="6" r="3"></circle><path d="M12 6h5a2 2 0 0 1 2 2v7"></path><path d="m15 9-3-3 3-3"></path><circle cx="19" cy="18" r="3"></circle><path d="M12 18H7a2 2 0 0 1-2-2V9"></path><path d="m9 15 3 3-3 3"></path></svg></g><text x="38" y="855" fill="#a82057" font-size="18" font-weight="700"><tspan x="38" dy="0">Compare destinations</tspan></text><text x="38" y="884" fill="#242633" font-size="16" font-weight="500"><tspan x="38" dy="0">The connected host must match</tspan><tspan x="38" dy="23">the authenticated identity.</tspan>